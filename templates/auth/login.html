{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-1"><i class="bi bi-tools text-primary"></i></h3>
                <h4 class="text-center mb-4">Fixpoint</h4>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% if form.non_field_errors %}
                        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.username.id_for_label }}">Correo electrónico</label>
                        <input type="email" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                               class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                        <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="text-center mt-3 mb-0 small">
                    ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
