{% extends 'base.html' %}
{% block title %}Asignar ticket{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-4">Asignar TKT-{{ ticket.id|stringformat:"03d" }}</h3>
        <div class="card stat-card">
            <div class="card-body">
                <p class="text-secondary">{{ ticket.titulo }}</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="{{ form.agente.id_for_label }}">Agente</label>
                        {{ form.agente }}
                        {% for error in form.agente.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Asignar</button>
                        <a href="{% url 'detalle_ticket' ticket.id %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
