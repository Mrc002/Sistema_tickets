{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fixpoint{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #1e1e2d;
            --badge-nuevo: #3b82f6;
            --badge-asignado: #8b5cf6;
            --badge-proceso: #f59e0b;
            --badge-resuelto: #10b981;
            --badge-cerrado: #6b7280;
        }
        body { background-color: #f4f5f7; }
        .sidebar {
            background-color: var(--sidebar-bg);
            min-height: 100vh;
            color: #cfcfe4;
        }
        .sidebar a { color: #cfcfe4; text-decoration: none; }
        .sidebar a:hover, .sidebar a.active { color: #fff; background-color: rgba(255,255,255,.08); }
        .sidebar .brand { color: #fff; font-weight: 700; letter-spacing: .5px; }
        .badge-estado { color: #fff; font-weight: 600; }
        .badge-Nuevo { background-color: var(--badge-nuevo); }
        .badge-Asignado { background-color: var(--badge-asignado); }
        .badge-EnProceso { background-color: var(--badge-proceso); }
        .badge-Resuelto { background-color: var(--badge-resuelto); }
        .badge-Cerrado { background-color: var(--badge-cerrado); }
        .badge-Cancelado { background-color: #ef4444; }
        .sla-vencido { color: #dc2626; font-weight: 600; }
        .stat-card { border: none; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .timeline-item { border-left: 2px solid #e5e7eb; padding-left: 1rem; }
        .timeline-item.sistema { border-left-color: #cbd5e1; color: #475569; }
        .timeline-item.interno { border-left-color: #f59e0b; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        {% if user.is_authenticated %}
        {% include 'partials/navbar.html' %}
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
        {% else %}
        <main class="col-12 py-5">
        {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
